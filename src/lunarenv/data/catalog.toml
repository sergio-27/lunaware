# kind:  geotiff | spice-lsk | spice-pck-text | spice-pck-binary | spice-fk | spice-spk
# groups: a file is fetched by `fetch_group(<name>)` for each group it belongs to.
# Reference keys (citation) resolve in docs/references.md.

