[project]
name = "lunarenv"
version = "0.1.0.dev0"
description = "Open, verified lunar surface environment engine: illumination and thermal conditions at the lunar south pole"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["moon", "lunar", "illumination", "thermal", "SPICE", "LOLA"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "rasterio>=1.4",
    "spiceypy>=6.0",
    "pydantic>=2.7",
    "platformdirs>=4.0",
    "truststore>=0.9",
    "matplotlib>=3.9",
    "xarray>=2024.6",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "pyyaml>=6.0",
    "mcp>=1.2",
]

[project.scripts]
lunarenv = "lunarenv.cli:main"
lunarenv-mcp = "lunarenv.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunarenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs files from the local data cache (skipped when absent)",
    "network: needs internet access",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# study scripts: readability of tables over lint strictness
"benchmarks/*" = ["E501", "B905", "B023", "E401", "I001", "NPY001"]
# validation cases are tables of reference values and long provenance strings
"src/lunarenv/validation/cases_*.py" = ["E501"]
"src/lunarenv/validation/core.py" = ["E501"]
# long descriptive strings (variable names, model descriptions, schema help)
"src/lunarenv/runner.py" = ["E501"]
"src/lunarenv/scenario/schema.py" = ["E501"]
"src/lunarenv/cli.py" = ["E501"]
"src/lunarenv/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lunarenv"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "spiceypy.*", "numba.*", "yaml.*", "h5netcdf.*", "anyio.*"]
ignore_missing_imports = true
